<title>Not found</title>
<script>/* Old MyTesla paths (from before the 2026-11-17 move) -> same path under /mytesla/. Never loops inside /mytesla/. */
(function(){var p=location.pathname,A='/mytesla/';if(p===A.slice(0,-1)||p.indexOf(A)===0)return;
var r=p.replace(/^\/+/,'').replace(/(^|\/)index\.html$/,'$1');location.replace(A+r+location.search+location.hash);})();</script>
<style>html{background:#050506;color:#a1a1a6;font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}body{margin:0;padding:40px 16px;text-align:center}a{color:inherit}</style>
</head>
